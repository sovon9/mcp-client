spring.application.name=mcp-client

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

logging.level.org.springframework=DEBUG

spring.ai.mcp.client.streamable-http.connections.local-mcp-server.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.local-mcp-server.endpoint=/mcp
